{% extends 'base.html' %}

{% block title %}My Reading List{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">My Reading List</h1>
    
    <div id="reading-list" class="space-y-4">
        <div class="text-center py-8">Loading your reading list...</div>
    </div>
</div>

<script>
async function loadReadingList() {
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/login/';
        return;
    }
    
    try {
        const resp = await fetch('/api/articles/articles/reading_list/', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const items = await resp.json();
        const container = document.getElementById('reading-list');
        
        if (items.length === 0) {
            container.innerHTML = '<div class="text-center py-16 text-gray-500">No saved articles. <a href="/articles/" class="text-blue-600">Browse articles →</a></div>';
            return;
        }
        
        container.innerHTML = items.map(item => `
            <div class="bg-white rounded-lg shadow p-4 flex justify-between items-center">
                <div class="flex-1">
                    <a href="/articles/${item.article.slug}/" class="text-xl font-semibold hover:text-blue-600">${item.article.title}</a>
                    <p class="text-gray-500 text-sm mt-1">Saved on ${new Date(item.added_at).toLocaleDateString()}</p>
                </div>
                <button onclick="removeFromReadingList('${item.article.slug}')" class="text-red-500 hover:text-red-700 px-3">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `).join('');
        
    } catch(e) { console.error(e); }
}

async function removeFromReadingList(slug) {
    const token = localStorage.getItem('access_token');
    try {
        const resp = await fetch(`/api/articles/articles/${slug}/unsave/`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (resp.ok || resp.status === 204) {
            loadReadingList();
        }
    } catch(e) { console.error(e); }
}

document.addEventListener('DOMContentLoaded', loadReadingList);
</script>
{% endblock %}
