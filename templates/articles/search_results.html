{% extends 'base.html' %}

{% block title %}Search Results{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold mb-2">Search Results</h1>
        <p class="text-gray-600" id="search-query-display"></p>
    </div>
    
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="search-results-container">
        <div class="col-span-full text-center py-8">Loading results...</div>
    </div>
    
    <div id="pagination" class="flex justify-center gap-2 mt-8"></div>
</div>

<script>
let currentPage = 1;
let currentQuery = '';

function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param) || '';
}

async function performSearch() {
    currentQuery = getQueryParam('q');
    if (!currentQuery) {
        document.getElementById('search-results-container').innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">Enter a search term to find articles.</div>';
        document.getElementById('search-query-display').innerHTML = '';
        return;
    }
    
    document.getElementById('search-query-display').innerHTML = `Showing results for: <strong class="text-indigo-600">"${currentQuery}"</strong>`;
    
    const token = localStorage.getItem('access_token');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
    const url = `/api/articles/articles/?search=${encodeURIComponent(currentQuery)}&page=${currentPage}`;
    
    try {
        const resp = await fetch(url, { headers });
        const data = await resp.json();
        const container = document.getElementById('search-results-container');
        
        if (data.results && data.results.length > 0) {
            container.innerHTML = data.results.map(article => `
                <div class="card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-all">
                    ${article.featured_image ? `<img src="${article.featured_image}" class="w-full h-48 object-cover">` : '<div class="w-full h-48 bg-gray-200 flex items-center justify-center"><i class="fas fa-newspaper text-4xl text-gray-400"></i></div>'}
                    <div class="p-6">
                        <div class="flex items-center gap-2 mb-2">
                            ${article.required_tier !== 'free' ? '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">Premium</span>' : '<span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">Free</span>'}
                            <span class="text-sm text-gray-500"><i class="far fa-clock mr-1"></i>${article.read_time_minutes} min read</span>
                        </div>
                        <h3 class="text-xl font-bold mb-2 hover:text-indigo-600 transition"><a href="/articles/${article.slug}/">${highlightText(article.title, currentQuery)}</a></h3>
                        <p class="text-gray-600 mb-4">${highlightText(article.excerpt?.substring(0, 120) || '', currentQuery)}...</p>
                        <div class="flex justify-between items-center">
                            <a href="/articles/${article.slug}/" class="text-indigo-600 font-semibold hover:underline">Read More →</a>
                            <span class="text-sm text-gray-400"><i class="far fa-eye mr-1"></i> ${article.view_count}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-500">No articles found matching your search. Try different keywords.</div>';
        }
        
        // Pagination
        const pagination = document.getElementById('pagination');
        if (data.total_pages > 1) {
            let pages = '';
            for (let i = 1; i <= Math.min(data.total_pages, 10); i++) {
                pages += `<button onclick="goToPage(${i})" class="px-3 py-1 rounded transition ${i === currentPage ? 'bg-indigo-600 text-white' : 'bg-gray-200 hover:bg-gray-300'}">${i}</button>`;
            }
            pagination.innerHTML = pages;
        } else {
            pagination.innerHTML = '';
        }
    } catch(e) { 
        console.error(e);
        container.innerHTML = '<div class="col-span-full text-center py-8 text-red-600">Error loading search results. Please try again.</div>';
    }
}

function highlightText(text, query) {
    if (!text || !query) return text;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark class="bg-yellow-200 px-0.5 rounded">$1</mark>');
}

function goToPage(page) {
    currentPage = page;
    performSearch();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', performSearch);
</script>
{% endblock %}
