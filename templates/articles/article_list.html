{% extends 'base.html' %}

{% block title %}All Articles{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
        <h1 class="text-4xl font-bold">All Articles</h1>
        <div class="flex gap-2">
            <input type="text" id="search-input" placeholder="Search articles..." class="border rounded-lg px-4 py-2 w-64">
            <select id="sort-select" class="border rounded-lg px-4 py-2">
                <option value="-published_at">Latest</option>
                <option value="-view_count">Most Popular</option>
                <option value="read_time_minutes">Shortest</option>
            </select>
        </div>
    </div>
    
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="articles-container">
        <div class="col-span-full text-center py-8">Loading articles...</div>
    </div>
    
    <div id="pagination" class="flex justify-center gap-2 mt-8"></div>
</div>

<script>
let currentPage = 1;
let searchQuery = '';
let sortBy = '-published_at';

async function loadArticles() {
    const token = localStorage.getItem('access_token');
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
    const url = `/api/articles/articles/?page=${currentPage}&search=${searchQuery}&ordering=${sortBy}`;
    
    try {
        const resp = await fetch(url, { headers });
        const data = await resp.json();
        const container = document.getElementById('articles-container');
        
        if (data.results && data.results.length > 0) {
            container.innerHTML = data.results.map(article => {
                // Build meta info HTML
                let metaInfoHtml = `
                    <div class="flex items-center gap-2 mb-2 flex-wrap">
                        ${article.required_tier !== 'free' ? '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">Premium</span>' : ''}
                        <span class="text-sm text-gray-500"><i class="far fa-clock mr-1"></i> ${article.read_time_minutes} min read</span>
                    </div>
                `;
                
                // Add source name if exists
                if (article.source_name) {
                    metaInfoHtml += `
                        <div class="text-xs text-gray-500 mb-2 flex items-center gap-1">
                            <i class="fas fa-rss"></i> ${article.source_name}
                        </div>
                    `;
                }
                
                // Get source display name (with fallback to 'NewsPlatform')
                const sourceDisplay = article.source_name || 'NewsPlatform';
                
                return `
                    <div class="card hover:shadow-lg transition-shadow duration-300">
                        ${article.featured_image ? `<img src="${article.featured_image}" class="w-full h-48 object-cover rounded-t-lg">` : '<div class="w-full h-48 bg-gradient-to-r from-purple-500 to-pink-500 rounded-t-lg flex items-center justify-center"><i class="fas fa-newspaper text-white text-4xl"></i></div>'}
                        <div class="p-6">
                            ${metaInfoHtml}
                            <h3 class="text-xl font-bold mb-2 line-clamp-2">${escapeHtml(article.title)}</h3>
                            <p class="text-gray-600 mb-4 line-clamp-3">${article.excerpt?.substring(0, 120) || ''}${article.excerpt?.length > 120 ? '...' : ''}</p>
                            <div class="flex justify-between items-center">
                                <a href="/articles/${article.slug}/" class="text-blue-600 font-semibold hover:underline">Read More →</a>
                                <div class="flex gap-3 text-sm text-gray-400">
                                    <span title="Views"><i class="far fa-eye"></i> ${article.view_count || 0}</span>
                                    ${article.source_name ? `<span title="Source"><i class="fas fa-rss"></i></span>` : ''}
                                </div>
                            </div>
                            <!-- Source name display at the bottom of card -->
                            <div class="text-xs text-gray-400 mt-3 pt-2 border-t border-gray-100">
                                <i class="fas fa-newspaper mr-1"></i> ${escapeHtml(sourceDisplay)}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">No articles found.</div>';
        }
        
        // Pagination
        const pagination = document.getElementById('pagination');
        if (data.total_pages > 1) {
            let pages = '';
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(data.total_pages, currentPage + 2);
            
            if (startPage > 1) {
                pages += `<button onclick="goToPage(1)" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">1</button>`;
                if (startPage > 2) pages += `<span class="px-2">...</span>`;
            }
            
            for (let i = startPage; i <= endPage; i++) {
                pages += `<button onclick="goToPage(${i})" class="px-3 py-1 rounded ${i === currentPage ? 'bg-blue-600 text-white' : 'bg-gray-200 hover:bg-gray-300'}">${i}</button>`;
            }
            
            if (endPage < data.total_pages) {
                if (endPage < data.total_pages - 1) pages += `<span class="px-2">...</span>`;
                pages += `<button onclick="goToPage(${data.total_pages})" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">${data.total_pages}</button>`;
            }
            
            pagination.innerHTML = pages;
        } else {
            pagination.innerHTML = '';
        }
    } catch(e) { 
        console.error(e);
        document.getElementById('articles-container').innerHTML = '<div class="col-span-full text-center py-8 text-red-600">Error loading articles. Please refresh.</div>';
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function goToPage(page) {
    currentPage = page;
    loadArticles();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Debounce search for better performance
let searchTimeout;
document.getElementById('search-input').addEventListener('keyup', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchQuery = e.target.value;
        currentPage = 1;
        loadArticles();
    }, 300);
});

document.getElementById('sort-select').addEventListener('change', (e) => {
    sortBy = e.target.value;
    currentPage = 1;
    loadArticles();
});

document.addEventListener('DOMContentLoaded', loadArticles);
</script>
{% endblock %}
