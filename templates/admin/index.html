{% extends "admin/index.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
    <div class="module" style="margin-bottom: 20px;">
        <h2>Quick Actions</h2>

            <a href="/admin-dashboard/" class="button" style="background: #6366f1; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; display: inline-block;">

            <a href="/admin/subscriptions/subscription/" class="button" style="background: #3b82f6; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; display: inline-block;">

            <a href="/swagger/" class="button" style="background: #f59e0b; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; display: inline-block;">

    {{ block.super }}
